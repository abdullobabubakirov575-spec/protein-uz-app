appId: uz.protein.app
name: Protein.uz — full purchase flow
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- extendedWaitUntil:
    visible:
      id: hero-cta
    timeout: 60000

- tapOn:
    id: tab-profile
- tapOn:
    id: lang-ru
- assertVisible: Русский
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 01-profile-language

- tapOn:
    id: tab-home
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-home
- scrollUntilVisible:
    element:
      id: product-.*
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 03-home-popular
- scroll
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04-home-brands

- tapOn:
    id: tab-catalog
- extendedWaitUntil:
    visible:
      id: chip-all
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05-catalog
- tapOn:
    id: chip-protein
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 06-catalog-protein

- tapOn:
    id: product-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: add-to-cart
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 07-product
- tapOn:
    id: product-qty-inc
- tapOn:
    id: add-to-cart
- extendedWaitUntil:
    visible:
      id: in-cart-banner
    timeout: 5000
- takeScreenshot: 08-product-added
- tapOn:
    id: in-cart-banner

- scrollUntilVisible:
    element:
      id: checkout-button
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 09-cart

- tapOn:
    id: checkout-button
- extendedWaitUntil:
    visible:
      id: checkout-name
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 10-checkout
- scrollUntilVisible:
    element:
      id: checkout-submit
    direction: DOWN
    timeout: 20000
- takeScreenshot: 11-checkout-summary
- tapOn:
    id: checkout-submit
- scrollUntilVisible:
    element: Введите имя
    direction: UP
    timeout: 10000
- takeScreenshot: 12-checkout-validation
- tapOn:
    id: checkout-name
- inputText: Test
- tapOn:
    id: checkout-phone
- inputText: '901234567'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 13-checkout-filled
- tapOn:
    id: checkout-close

- repeat:
    while:
      visible:
        id: qty-.*-dec
    commands:
      - tapOn:
          id: qty-.*-dec
- extendedWaitUntil:
    visible: Корзина пуста
    timeout: 10000
- takeScreenshot: 14-cart-empty
