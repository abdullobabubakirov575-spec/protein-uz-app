name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ipa:
        description: Build unsigned IPA
        type: boolean
        default: true
      preview:
        description: Run UI tests on iPhone simulators (live page + video + screenshots)
        type: boolean
        default: true
      app_run_id:
        description: Reuse the simulator app from this run id (skips the build)
        type: string
        default: ''

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  BUNDLE_ID: uz.protein.app

jobs:
  ipa:
    name: Unsigned IPA
    if: github.event_name == 'push' || inputs.ipa
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry ProteinUz.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Protein.uz-ipa
          path: dist/ProteinUz.ipa
          retention-days: 30

  preview:
    name: iPhone simulator tests
    if: github.event_name == 'push' || inputs.preview
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      LIVE: ${{ github.workspace }}/live-site
      GH_TOKEN: ${{ github.token }}
      REUSE_RUN: ${{ inputs.app_run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Start live page
        run: |
          mkdir -p "$LIVE" preview
          cp .github/live/index.html "$LIVE/"
          ln -s "$GITHUB_WORKSPACE/preview" "$LIVE/preview"
          echo '[]' > "$LIVE/shots.json"
          : > "$LIVE/log.txt"
          source .github/live/lib.sh
          live_stage setup
          nohup python3 -m http.server 8080 --bind 127.0.0.1 --directory "$LIVE" > "$RUNNER_TEMP/http.log" 2>&1 &
          if curl -fsSL -o "$RUNNER_TEMP/cf.tgz" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz; then
            tar -xzf "$RUNNER_TEMP/cf.tgz" -C "$RUNNER_TEMP"
            CF="$RUNNER_TEMP/cloudflared"
          else
            brew install cloudflared
            CF=cloudflared
          fi
          nohup "$CF" tunnel --no-autoupdate --url http://127.0.0.1:8080 > "$RUNNER_TEMP/cf.log" 2>&1 &
          URL=""
          for i in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cf.log" | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          echo "Live page: $URL"
          echo "### 🔴 Live: $URL" >> "$GITHUB_STEP_SUMMARY"
          ISSUE=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 Live: тест на симуляторах iPhone · run ${GITHUB_RUN_ID}" \
            --body "Живая страница прогона: $URL" | grep -oE '[0-9]+$' || true)
          echo "LIVE_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          nohup bash .github/live/capture.sh > "$RUNNER_TEMP/capture.log" 2>&1 &

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        if: env.REUSE_RUN == ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: env.REUSE_RUN == ''
        run: |
          set -o pipefail
          source .github/live/lib.sh
          live_stage deps
          npm ci 2>&1 | tee -a "$LIVE/log.txt"

      - name: Generate iOS project
        if: env.REUSE_RUN == ''
        run: |
          set -o pipefail
          source .github/live/lib.sh
          live_stage prebuild
          npx expo prebuild --platform ios 2>&1 | tee -a "$LIVE/log.txt"

      - name: Build for simulator
        if: env.REUSE_RUN == ''
        run: |
          set -o pipefail
          source .github/live/lib.sh
          live_stage build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify | tee -a "$LIVE/log.txt"
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n1)
          ditto -c -k --keepParent "$APP" simulator-app.zip

      - name: Download prebuilt simulator app
        if: env.REUSE_RUN != ''
        run: |
          source .github/live/lib.sh
          live_stage build "" "берём готовую сборку из run $REUSE_RUN"
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" -n Protein.uz-simulator-app -D .

      - uses: actions/upload-artifact@v4
        if: env.REUSE_RUN == ''
        with:
          name: Protein.uz-simulator-app
          path: simulator-app.zip
          retention-days: 14

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run UI tests on iPhone 16, iPhone SE, iPhone 16 Pro Max
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: |
          source .github/live/lib.sh
          mkdir -p sim-app && ditto -x -k simulator-app.zip sim-app
          APP_PATH=$(ls -d sim-app/*.app | head -n1)
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']]
          print(sorted(runtimes, key=lambda r: [int(p) for p in r['version'].split('.')])[-1]['identifier'])")
          echo "Runtime: $RUNTIME" | tee -a "$LIVE/log.txt"
          STATUS=0

          run_device() {
            local name="$1" type="$2" slug="$3" record="$4" udid rec=""
            live_stage "$slug" "$name" "загрузка симулятора"
            udid=$(xcrun simctl create "$name" "$type" "$RUNTIME") || { echo "::warning::$name is not available"; live_fail "$slug"; return 0; }
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            xcrun simctl location "$udid" set 41.3111,69.2797
            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl privacy "$udid" grant location "$BUNDLE_ID" || true
            mkdir -p "preview/$slug"
            if [ "$record" = "1" ]; then
              xcrun simctl io "$udid" recordVideo --codec=h264 --force "preview/$slug.mp4" &
              rec=$!
              sleep 2
            fi
            live_stage "$slug" "$name" "идёт тест"
            set -o pipefail
            if ! (cd "preview/$slug" && maestro --device "$udid" test \
                --format junit --output report.xml \
                --test-output-dir debug \
                "$GITHUB_WORKSPACE/.maestro/preview.yaml" 2>&1 | tee -a "$LIVE/log.txt"); then
              STATUS=1
              live_fail "$slug"
              echo "::error::UI test failed on $name"
            fi
            set +o pipefail
            if [ -n "$rec" ]; then
              kill -INT "$rec"
              wait "$rec" || true
            fi
            xcrun simctl shutdown "$udid" || true
          }

          run_device "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 iphone-16 1
          run_device "iPhone SE" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation iphone-se 0
          run_device "iPhone 16 Pro Max" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max iphone-16-pro-max 0
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Protein.uz-preview
          path: preview
          retention-days: 30

      - name: Keep live page open for a few minutes
        if: always()
        run: |
          source .github/live/lib.sh
          live_stage done
          sleep 240
          [ -n "${LIVE_ISSUE:-}" ] && gh issue close "$LIVE_ISSUE" --repo "$GITHUB_REPOSITORY" --comment "Прогон завершён" || true
